name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the whole suite on the tagged commit before it
  # publishes the image.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The privilege-drop regression needs root, which the runner user
      # lacks — run the already-built test binary under sudo, and fail if
      # the filter stops matching the test.
      - name: Privilege-drop test as root
        run: |
          bin=$(cargo test -p kagero-agent --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test) | .executable')
          out=$(sudo "$bin" --ignored --exact process::tests::spawn_drops_privileges_as_root)
          echo "$out"
          grep -q '^test result: ok. 1 passed' <<<"$out"

  msrv:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check on the rust-version declared in Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --locked

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: cargo build -p kagero-agent
      - run: pnpm test
      # The same simulator E2E through a real collector: the agent renders
      # the fixture and supervises the collector, and the collector strips
      # the forbidden attributes the test app sends. The run above only
      # reaches the mock sink. This run also loads the shipped
      # collector/lgtm and collector/cloudwatch templates, rendered by the
      # agent, and checks the stripping at the receiver (templates.test.ts,
      # skipped when KAGERO_SIM_COLLECTOR_BIN is unset).
      - name: Simulator E2E through otelcol-contrib
        run: |
          version=0.141.0
          sha256=9b02ffec7c018c621e81eea610d771a6ea99c782693bd454f0837dc56a14bc4c
          tgz="otelcol-contrib_${version}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v$version/$tgz"
          echo "$sha256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" otelcol-contrib
          KAGERO_SIM_COLLECTOR_BIN="$RUNNER_TEMP/otelcol-contrib" pnpm --filter @kagero/sim test
      - name: Check example apps parse
        run: |
          node --check examples/node/app/index.mjs
          python3 -m py_compile examples/python/app/main.py
          rm -rf examples/python/app/__pycache__

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm generate
      - name: Ensure generated output is committed
        run: |
          git add -A
          git diff --cached --exit-code

  # The shipped image, built as release.yml builds it (Alpine/musl, the
  # release profile, arm64) but not pushed.
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/agent.Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
