name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The privilege-drop regression needs root, which the runner user
      # lacks — run the already-built test binary under sudo, and fail if
      # the filter stops matching the test.
      - name: Privilege-drop test as root
        run: |
          bin=$(cargo test -p kagero-agent --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test) | .executable')
          out=$(sudo "$bin" --ignored --exact process::tests::spawn_drops_privileges_as_root)
          echo "$out"
          grep -q '^test result: ok. 1 passed' <<<"$out"

  msrv:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Check on the rust-version declared in Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --locked

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: cargo build -p kagero-agent
      - run: pnpm test
      - name: Check example apps parse
        run: |
          node --check examples/node/app/index.mjs
          python3 -m py_compile examples/python/app/main.py
          rm -rf examples/python/app/__pycache__

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm generate
      - name: Ensure generated output is committed
        run: |
          git add -A
          git diff --cached --exit-code
