name: release

# Tag-triggered publish of the agent image to GHCR
# (docs/roadmap.md: v0.1 ships ghcr.io/seike460/kagero). Semver tags
# v0.1.0 produce image tags 0.1.0 and 0.1 — the short tag is what the
# examples' `COPY --from=` references.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent-image:
    # ARM runner: MicroVM images are aarch64; the Alpine/musl build is
    # native here (no QEMU). Add linux/amd64 later if an amd64 MicroVM
    # base ever ships — the examples' base image dictates the arch.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/agent.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
